apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    kompose.cmd: kompose -f ../docker-compose.yml convert --controller statefulset
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        io.kompose.service: postgres
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: TZ
              value: Asia/Shanghai
          image: docker.io/library/postgres:17
          name: postgres
          tty: true
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pgs-data
            - mountPath: /docker-entrypoint-initdb.d/create_dbs.sql
              name: postgres-cm1
              readOnly: true
              subPath: create_dbs.sql
            - mountPath: /etc/localtime
              name: postgres-cm2
              readOnly: true
              subPath: localtime
            - mountPath: /etc/timezone
              name: postgres-cm3
              readOnly: true
              subPath: timezone
      restartPolicy: Always
      volumes:
        - name: postgres-cm1
          configMap:
            name: postgres-cm1
        - name: postgres-cm2
          configMap:
            name: postgres-cm2
        - name: postgres-cm3
          configMap:
            name: postgres-cm3
  volumeClaimTemplates:
    - metadata:
        labels:
          io.kompose.service: pgs-data
        name: pgs-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
