apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f ../docker-compose.service.yml convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: user-service
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f ../docker-compose.service.yml convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: user-service
    spec:
      containers:
        - env:
            - name: GIN_MODE
              value: release
          image: user-service
          name: user-service
          ports:
            - containerPort: 8081
              protocol: TCP
            - containerPort: 50051
              protocol: TCP
          tty: true
      restartPolicy: Always
