apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    kompose.cmd: kompose -f ../docker-compose.yml convert --controller statefulset
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: minio
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: minio
  serviceName: minio
  template:
    metadata:
      labels:
        io.kompose.service: minio
    spec:
      containers:
        - args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
            - name: MINIO_ROOT_USER
              value: minioadmin
          image: docker.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
          name: minio
          ports:
            - containerPort: 9001
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: minio-data
            - mountPath: /etc/timezone
              name: minio-cm1
              readOnly: true
              subPath: timezone
      restartPolicy: Always
      volumes:
        - name: minio-cm1
          configMap:
            name: minio-cm1
  volumeClaimTemplates:
    - metadata:
        labels:
          io.kompose.service: minio-data
        name: minio-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
