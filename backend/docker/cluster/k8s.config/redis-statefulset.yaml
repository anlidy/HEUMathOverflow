apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    kompose.cmd: kompose -f ../docker-compose.yml convert --controller statefulset
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: redis
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  serviceName: redis
  template:
    metadata:
      labels:
        io.kompose.service: redis
    spec:
      containers:
        - args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          image: docker.io/library/redis:7-alpine
          name: redis
          volumeMounts:
            - mountPath: /data
              name: redis-data
            - mountPath: /etc/timezone
              name: redis-cm1
              readOnly: true
              subPath: timezone
      restartPolicy: Always
      volumes:
        - name: redis-cm1
          configMap:
            name: redis-cm1
  volumeClaimTemplates:
    - metadata:
        labels:
          io.kompose.service: redis-data
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
