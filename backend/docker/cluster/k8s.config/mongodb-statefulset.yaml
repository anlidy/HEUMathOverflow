apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    kompose.cmd: kompose -f ../docker-compose.yml convert --controller statefulset
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: mongodb
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mongodb
  serviceName: mongodb
  template:
    metadata:
      labels:
        io.kompose.service: mongodb
    spec:
      containers:
        - env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: mongoadmin
            - name: MONGO_INITDB_ROOT_USERNAME
              value: mongoadmin
          image: docker.io/library/mongo:8.0
          name: mongodb
          volumeMounts:
            - mountPath: /data/db
              name: mongo-data
            - mountPath: /data/configdb
              name: mongo-config-db
            - mountPath: /docker-entrypoint-initdb.d/init.js
              name: mongodb-cm2
              readOnly: true
              subPath: init.js
            - mountPath: /etc/timezone
              name: mongodb-cm3
              readOnly: true
              subPath: timezone
      restartPolicy: Always
      volumes:
        - name: mongodb-cm2
          configMap:
            name: mongodb-cm2
        - name: mongodb-cm3
          configMap:
            name: mongodb-cm3
  volumeClaimTemplates:
    - metadata:
        labels:
          io.kompose.service: mongo-data
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
    - metadata:
        labels:
          io.kompose.service: mongo-config-db
        name: mongo-config-db
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
