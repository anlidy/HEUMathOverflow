services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-user_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - ./data/Postgre:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/Redis:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/Minio:/data

  user-service:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: cmd/user-service
        CONFIG_PATH: cmd/user-service/user.yaml
        EXPOSE_PORT: 8081
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      # App reads internal/common/config/user.yaml by default; config file already points to container hostnames.
      GIN_MODE: release
    ports:
      - "8081:8081"

  forum-service:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: cmd/forum-service
        CONFIG_PATH: cmd/forum-service/forum.yaml
        EXPOSE_PORT: 8082
    depends_on:
      - postgres
      - minio
    environment:
      GIN_MODE: release
    ports:
      - "8082:8082"

  audit-service:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: cmd/audit-service
        CONFIG_PATH: cmd/audit-service/audit.yaml
        EXPOSE_PORT: 8083
    depends_on:
      - postgres
    environment:
      GIN_MODE: release
    ports:
      - "8083:8083"
