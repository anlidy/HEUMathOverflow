
services:
  # 用户服务
  user-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
      args:
        SERVICE: user
        EXPOSE_PORT: 8081
    tty: true         # 给容器分配伪终端（-t）
    volumes:
      - go-build:/root/.cache/go-build:rw
      - go-mod:/go/pkg/mod:rw
    environment:
      # App reads internal/common/config/user.yaml by default; config file already points to container hostnames.
      GIN_MODE: release
    ports:
      - "8081:8081"
    expose:
      - "50051"         # gRPC 只在 Docker 网络内部可见
    develop:
      watch: 
        - action: sync
          path: ..
          target: /src
          ignore:
            - .git/
            - docker/
            - cmd/forum-service/
            - cmd/audit-service/
            - cmd/user-service/.air.toml
            - internal/forum-service/
            - internal/audit-service/
            - proto/forum/
            - proto/audit/

        - action: rebuild 
          path: ../docker/Dockerfile
        
        - action: sync+restart 
          path: ../cmd/user-service/.air.toml
          target: /src/cmd/user-service/.air.toml

  # 论坛服务
  forum-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
      args:
        SERVICE: forum
        EXPOSE_PORT: 8082
    tty: true         # 给容器分配伪终端（-t）
    volumes:
      - go-build:/root/.cache/go-build:rw
      - go-mod:/go/pkg/mod:rw
    environment:
      GIN_MODE: release
    ports:
      - "8082:8082"
    develop:
      watch: 
        - action: sync
          path: ..
          target: /src
          ignore:
            - .git/
            - docker/
            - cmd/forum-service/.air.toml
            - cmd/audit-service/
            - cmd/user-service/
            - internal/user-service/
            - internal/audit-service/
            - proto/user/
            - proto/audit/

        - action: rebuild 
          path: ../docker/Dockerfile
        
        - action: sync+restart 
          path: ../cmd/forum-service/.air.toml
          target: /src/cmd/forum-service/.air.toml

  # 审核模块
  audit-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
      args:
        SERVICE: audit
        EXPOSE_PORT: 8083
    tty: true         # 给容器分配伪终端（-t）
    volumes:
      - go-build:/root/.cache/go-build:rw
      - go-mod:/go/pkg/mod:rw
    environment:
      GIN_MODE: release
    ports:
      - "8083:8083"
    develop:
      watch: 
        - action: sync
          path: ..
          target: /src
          ignore:
            - .git/
            - docker/
            - cmd/forum-service/
            - cmd/audit-service/.air.toml
            - cmd/user-service/
            - internal/user-service/
            - internal/forum-service/
            - proto/user/
            - proto/forum/

        - action: rebuild 
          path: ../docker/Dockerfile
        
        - action: sync+restart 
          path: ../cmd/audit-service/.air.toml
          target: /src/cmd/audit-service/.air.toml

  pgsadmin:
    image: docker.io/dpage/pgadmin4:snapshot
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    tty: true
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    tty: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    # ports:
    #   - "5432:5432"
    volumes:
      - pgs_data:/var/lib/postgresql/data
      - ./Postgre/create_dbs.sql:/docker-entrypoint-initdb.d/create_dbs.sql:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro  # 可选

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
      - /etc/timezone:/etc/timezone:ro  # 可选

  minio:
    image: docker.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - /etc/timezone:/etc/timezone:ro  # 可选
  
  mongodb:
    image: docker.io/library/mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: 
    # ports:
    #  - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config_db:/data/configdb
      - ./Mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro # 初始化创建数据库
      - /etc/timezone:/etc/timezone:ro  # 可选

networks:
  default:
    name: backend_default
    driver: bridge
  
volumes:
  pgs_data:
  pgadmin_data:
  redis_data:
  minio_data:
  mongo_data:
  mongo_config_db:
  go-build:
  go-mod: