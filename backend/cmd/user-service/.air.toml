root = "../.."
tmp_dir = "tmp_user"

[build]
  cmd = "go build ."
  bin = "./user-service"
  full_bin = "./user-service"
  include_ext = ["go", "yaml", "mod", "sum"]
  exclude_dir = ["tmp_", "vendor", "bin", "docker", "proto"]
  include_dir = ["cmd/user-service", "internal/user-service", "internal/common"]
  delay = 1000

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"